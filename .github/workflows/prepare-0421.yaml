name: Prepare Calcit 0.42.1 migration

on:
  push:
    branches: [prepare/toadflax-calcit-0421]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Check out repository
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn --version

    - name: Set up Calcit and Caps
      uses: calcit-lang/setup-calcit@4a5130ea981278fd4f624f2c2cf64e6776742c01 # v1.5.1
      with:
        tools: calcit,caps
        caps-version: "0.1.1"
        deps-file: deps.cirru
        github-token: ${{ github.token }}

    - name: Resolve immutable dependencies
      run: |
        set -euo pipefail
        caps --strict --ci
        yarn install --immutable
        caps verify --toolchain

    - name: Prepare typed state operation
      run: |
        set -euo pipefail
        ops='[["edit","def","app.schema/UiState","--code","quote (defunion UiState ChatState MessageBoxState NovelConfig)"],["edit","schema","app.schema/UiState","--code","quote UnionDef"],["tree","replace","app.schema/Op","--path","4.2","--expect","quote Dynamic","--code","quote UiState"],["tree","replace","app.schema/decode-op","--path","3.4.1","--code","quote (let ((path (decode-map-as cursor (List respo.schema/CoordKey)))) (if (map? value) (Op :legacy-states path (decode-map-as value (Map Tag Dynamic))) (Op :states path (decode-map-as value UiState))))"],["tree","insert","app.schema/Op","--path","4","--at","after","--code","quote (:legacy-states (List respo.schema/CoordKey) (Map Tag Dynamic))"],["tree","insert","app.schema/decode-op","--path","3.4","--at","after","--code","quote ((:legacy-states cursor value) (Op :legacy-states (decode-map-as cursor (List respo.schema/CoordKey)) (decode-map-as value (Map Tag Dynamic))))"],["tree","insert","app.updater/updater","--path","3.4","--at","after","--code","quote ((:legacy-states cursor state) (let ((tree (respo.cursor/update-state-tree (:states store) cursor state))) (if (map? tree) (assoc store :states tree) (raise |Expected-state-map))))"],["edit","format"]]'
        calcit edit transaction --code "$ops" --dry-run --format json > /tmp/toadflax-transaction.json
        jq -e '.changed and (.operations | length == 8)' /tmp/toadflax-transaction.json
        calcit edit transaction --code "$ops" --expect-revision "$(jq -r .original_revision /tmp/toadflax-transaction.json)"
        git diff --binary -- calcit.cirru > /tmp/toadflax-0421.patch
        test -s /tmp/toadflax-0421.patch
        git add calcit.cirru

    - name: Validate Calcit snapshot and types
      run: |
        set -euo pipefail
        test -f calcit.cirru
        test -f deps.cirru
        test ! -e compact.cirru
        test ! -e package.cirru
        calcit calcit.cirru edit format
        git diff --quiet -- calcit.cirru
        calcit --check-only --all-defs
        report="$(calcit fix --workflow strict --verify --format json)"
        printf '%s\n' "$report"
        jq -e '.data.workflow.status? == "passed" and .diagnostics? == []' <<< "$report"
        calcit analyze weak-types --only coverage --summary-only --format json
        calcit analyze weak-types --only schema-dynamic,code-dynamic --intent unresolved --summary-only --format json
        calcit analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'
        calcit test --require-match

    - name: Select CDN asset path
      id: asset-path
      env:
        CDN_ORIGIN: https://cos-sh.tiye.me
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
        else
          asset_prefix="${GITHUB_REPOSITORY}/"
        fi
        base_url="${CDN_ORIGIN}/${asset_prefix}"
        echo "VITE_BASE_URL=${base_url}" >> "$GITHUB_ENV"
        echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
        echo "base-url=${base_url}" >> "$GITHUB_OUTPUT"

    - name: Build web assets with CDN URLs
      run: |
        set -euo pipefail
        yarn build
        node --test tests/*.test.mjs

    - name: Save verified source patch
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: toadflax-0421-source
        path: /tmp/toadflax-0421.patch
        if-no-files-found: error
